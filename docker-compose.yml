# Full local "production" stack:
#   app (AuthentiScan API) -> PostgreSQL, Kafka (Redpanda, Kafka-compatible)
#   Prometheus scrapes /metrics, evaluates alert rules; Grafana shows the dashboard.
# Start:  docker compose up -d --build
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://ops:ops@postgres:5432/authentiscan
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: scan-events
      FAULT_MODE: ${FAULT_MODE:-none}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: authentiscan
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql:/sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d authentiscan"]
      interval: 5s
      retries: 10

  kafka:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      - --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://kafka:9092
      - --set redpanda.auto_create_topics_enabled=true
    ports: ["9092:9092"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
