# Each alert links to the runbook an L2 engineer follows when it fires.
groups:
  - name: authentiscan
    rules:
      - alert: AuthentiScanDown
        expr: up{job="authentiscan"} == 0
        for: 1m
        labels: { severity: P1 }
        annotations:
          summary: "AuthentiScan API is not reachable"
          runbook: "docs/runbooks/RB-01-service-down.md"

      - alert: HighErrorRate
        expr: |
          sum(rate(authentiscan_requests_total{status=~"5.."}[5m]))
            / sum(rate(authentiscan_requests_total[5m])) > 0.05
        for: 2m
        labels: { severity: P2 }
        annotations:
          summary: "More than 5% of requests are failing"
          runbook: "docs/runbooks/RB-02-high-error-rate.md"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(authentiscan_request_seconds_bucket{endpoint="/verify"}[5m]))) > 1
        for: 3m
        labels: { severity: P3 }
        annotations:
          summary: "p95 /verify latency above 1s"
          runbook: "docs/runbooks/RB-03-high-latency.md"

      - alert: DatabaseDown
        expr: authentiscan_db_up == 0
        for: 1m
        labels: { severity: P1 }
        annotations:
          summary: "App cannot reach PostgreSQL"
          runbook: "docs/runbooks/RB-01-service-down.md"

      - alert: KafkaPublishFailures
        expr: increase(authentiscan_kafka_publish_failures_total[5m]) > 0
        for: 1m
        labels: { severity: P3 }
        annotations:
          summary: "Scan events are not reaching Kafka (analytics gap, users unaffected)"
          runbook: "docs/runbooks/RB-04-kafka-publish-failures.md"
