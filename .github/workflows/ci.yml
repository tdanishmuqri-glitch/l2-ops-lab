# CI: test -> build image -> push to GitHub Container Registry -> bump tag in k8s/ for ArgoCD.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q tests
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: ghcr.io/${{ github.repository_owner }}/authentiscan:${{ env.VERSION }}
      - name: Bump image tag for ArgoCD (GitOps)
        run: |
          sed -i "s#authentiscan:.*#authentiscan:${VERSION}#" k8s/deployment.yaml
          sed -i "/name: APP_VERSION/{n;s/value: .*/value: \"${VERSION}\"/}" k8s/deployment.yaml
          git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "deploy: authentiscan ${VERSION}" && git push origin main
